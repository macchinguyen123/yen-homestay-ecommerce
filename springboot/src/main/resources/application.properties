spring.application.name=springboot
spring.config.import=optional:file:./springboot/.env[.properties],optional:file:.env[.properties]
server.port=8081

# Database Connection (Neon PostgreSQL with SSL enabled & Optimized Pooling)
spring.datasource.url=jdbc:postgresql://ep-delicate-river-b5mbiu1t-pooler.c-7.us-east-2.aws.neon.tech:5432/homestays?sslmode=require&prepareThreshold=0&tcpKeepAlive=true&reWriteBatchedInserts=true
